[workspace]
members = [
  "crates/vertex-core",
  "crates/vertex-policy",
  "crates/vertex-audit",
  "crates/vertex-state",
  "crates/vertex-relations",
  "crates/vertex-memory",
  "crates/vertex-missions",
  "crates/vertex-git",
  "crates/vertex-runtime",
  "crates/vertex-vve",
  "crates/vertex-harness",
  "apps/vertex-harnessd",
  "apps/vertexctl",
]
resolver = "2"

[workspace.package]
version = "0.1.0-genesis"
edition = "2021"
license = "MIT"
authors = ["Vertex Project"]

[workspace.dependencies]
anyhow = "1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
